name: TripSplit CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest security & financial suite
        run: npm test

      - name: Run production webpack build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
        run: npm run build --webpack
